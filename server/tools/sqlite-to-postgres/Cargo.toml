[package]
name = "sqlite-to-postgres"
description = "Copies the old SQLite database (data/coemu.db) into the Postgres one"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
tq-db.workspace = true
dotenvy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dependencies.sqlx]
workspace = true
default-features = false
features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "macros"]
