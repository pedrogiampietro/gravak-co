[package]
name = "tq-logging"
description = "Terminal and file logging for the Gravak auth and game servers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "registry", "std"] }
tracing-appender = "0.2"
nu-ansi-term = "0.50"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
