# Monstros nossos: o modelo e as animações de um monstro original com uma
# pele pintada por nós (veja client/crates/content/src/monsters.rs e
# docs/conteudo-custom.md). `look` é o visual novo, que o servidor usa em
# monster_types.look; `base` é o monstro original de onde vêm o modelo e as
# animações. A pele vai para `colour` (mantendo a luz de cada pixel),
# `strength` do caminho; `light` clareia ou escurece (menos o brilho); com
# `glow`, as partes
# mais claras (acima de `glow_from`, de 0 a 1) brilham nessa cor.

# --- Fenda Menor: a cripta fria, ossos e almas em azul e verde ---

