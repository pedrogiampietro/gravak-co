# As Fendas do Gravak: os labirintos que o build gera (veja
# client/crates/content/src/rifts.rs e docs/fendas-design.md).
#
# Cada fenda é um mapa nosso: uma cripta de corredores de 5 células, com a
# arte de content/art/cripta. A mesma `seed` gera sempre o mesmo labirinto;
# trocar a seed gera outro. `rooms` são as salas do labirinto na horizontal e
# na vertical (cada sala tem 5 por 5 células, as paredes 2 de espessura).

