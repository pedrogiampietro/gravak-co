[package]
name = "gravak-content"
default-run = "gravak-content"
description = "Gravak content pipeline: original 5065 data formats, custom content and the build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sandbox-data.workspace = true
serde.workspace = true
image.workspace = true
toml = { version = "1.1", features = ["preserve_order"] }
# gravak-sign: the release key that signs update manifests.
ed25519-dalek = "2"
getrandom = "0.2"
