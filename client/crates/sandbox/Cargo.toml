# Source: @digitalm1nd on x.com / _dek on Discord — Preservation Conquer project — https://discord.gg/CvKPXEHYRY
[package]
name = "conquer-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sandbox-data.workspace = true
gravak-protocol.workspace = true
wgpu.workspace = true
winit.workspace = true
image.workspace = true
pollster.workspace = true
bytemuck.workspace = true
arboard = "3.6"
softbuffer = "0.4"
tokio = { version = "1.48", features = ["net", "rt", "sync", "time"] }
fontdb = "0.23"
fontdue = "0.9"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
ureq = "3"
# The website's answers to the Store's Buy CPs tab (cp_shop.rs).
serde.workspace = true
serde_json = "1"
# The release key the update manifests are signed with (updater.rs).
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# DPAPI, for the passwords the login screen saves.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
# The players' build (tools/package-client.ps1): game data only from the
# encrypted pack, game/gravak.gpk, never from loose files.
packed-only = []

[build-dependencies]
winresource = "0.1"
