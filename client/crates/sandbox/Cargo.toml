# Source: @digitalm1nd on x.com / _dek on Discord — Preservation Conquer project — https://discord.gg/CvKPXEHYRY
[package]
name = "conquer-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sandbox-data.workspace = true
gravak-protocol.workspace = true
wgpu.workspace = true
winit.workspace = true
image.workspace = true
bytemuck.workspace = true
softbuffer = "0.4"
fontdb = "0.23"
fontdue = "0.9"
# `Instant` that works in the browser too (std's panics on wasm32); on
# native it is std's own.
web-time = "1.1"
# The website's answers to the Store's Buy CPs tab (cp_shop.rs).
serde.workspace = true
serde_json = "1"
# The release key the update manifests are signed with (updater.rs).
ed25519-dalek = "2"
sha2 = "0.10"

# What the browser build (wasm32, docs/web-spike.md) cannot have: TCP,
# threads behind blocking calls, the clipboard, the sound device, HTTPS by
# ureq.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
arboard = "3.6"
tokio = { version = "1.48", features = ["net", "rt", "sync", "time"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
tokio = { version = "1.48", features = ["sync"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Response", "Storage", "console"] }
console_error_panic_hook = "0.1"

[target.'cfg(windows)'.dependencies]
# DPAPI, for the passwords the login screen saves.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
# The players' build (tools/package-client.ps1): game data only from the
# encrypted pack, game/gravak.gpk, never from loose files.
packed-only = []

[build-dependencies]
winresource = "0.1"
