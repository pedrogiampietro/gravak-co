[package]
name = "gravak-ws-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The browser client's way to the servers (docs/web-spike.md): WebSockets in,
# the same bytes out over TCP to the auth and game ports.
[dependencies]
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "macros", "io-util", "time"] }
tokio-tungstenite = "0.30.0"
