[package]
name = "gravak-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Sealed logins (seal_password).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
bytes = "1.10"
serde.workspace = true
tokio = { version = "1.48", features = ["rt", "macros"] }
tokio-stream = "0.1"
tq-crypto = { path = "../../../server/crates/crypto", features = ["std"] }
tq-codec = { path = "../../../server/crates/codec", features = ["std"] }
tq-network = { path = "../../../server/crates/network", features = ["std"] }
tq-serde = { path = "../../../server/crates/serde", features = ["std"] }

# TCP (Connection, authenticate, connect_game) only where there are
# sockets; the browser build (wasm32) will reach the servers through a
# WebSocket bridge instead (docs/web-spike.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48", features = ["net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
