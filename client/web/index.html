<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravak</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; color: #c9b98f; font: 14px sans-serif; }
    /* The client's window: winit follows the canvas's size. */
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>
<body>
  <script type="module">
    import init from "./gravak.js";
    init();
    // A click on the game gives it the keys (and with them Ctrl, Alt and
    // Shift): the world's canvas replaces the login's, and the page in the
    // site's frame starts without focus.
    document.addEventListener("pointerdown", (event) => {
      if (event.target instanceof HTMLCanvasElement && document.activeElement !== event.target) {
        event.target.focus({ preventScroll: true });
      }
    }, true);
  </script>
</body>
</html>
